name: Deploy homepage and study check-in

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out project
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js for checks
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check static project
        run: npm test
      - name: Assemble public website
        run: |
          mkdir -p _site
          cp index.html style.css CNAME .nojekyll _site/
          cp -R Assets study _site/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload public website
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
