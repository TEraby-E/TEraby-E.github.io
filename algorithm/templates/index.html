<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据结构模版 · Terabyte</title>
  <link rel="icon" href="../../Assets/Icons/terabyte-favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="./templates.css">
  <script src="./templates.js" defer></script>
</head>
<body>
  <header class="site-header shell">
    <a class="brand" href="../"><img class="brand-mark" src="../../Assets/Icons/terabyte-flow.svg" alt="" width="38" height="38">algorithm</a>
  </header>
  <main class="shell template-page">
    <h1>数据结构模版</h1>
    <form id="check-in" class="template-panel">
      <label for="problem-title">题目</label>
      <input id="problem-title" type="text" required maxlength="120">
      <label for="solution-code">代码</label>
      <textarea id="solution-code" rows="10" required maxlength="100000" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off"></textarea>
      <div class="template-actions">
        <button type="submit">提交打卡</button>
        <span id="check-in-status" role="status">本机保存</span>
      </div>
    </form>
    <section class="template-panel" aria-labelledby="records-title">
      <h2 id="records-title">打卡记录</h2>
      <div id="check-in-records">暂无记录</div>
    </section>
  </main>
</body>
</html>
