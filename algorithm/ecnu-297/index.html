<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>基础算法题库 · Terabyte</title>
  <link rel="icon" href="../../Assets/Icons/terabyte-favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="./practice.css">
  <script src="./practice.js?v=20261108-eoj-links" defer></script>
</head>
<body>
  <header class="site-header shell">
    <a class="brand" href="../"><img class="brand-mark" src="../../Assets/Icons/terabyte-flow.svg" alt="" width="38" height="38">算法题图解</a>
    <nav aria-label="主导航"><a class="nav-github" href="https://acm.ecnu.edu.cn/contest/297/">ECNU 原题库 ↗</a></nav>
  </header>
  <main class="shell practice">
    <h1>基础算法题库</h1>
    <p class="practice-intro">68 道数据结构与算法练习。按 ECNU 难度从易到难排列，同难度按学习章节排序。</p>
    <form class="filters" id="problem-filters" role="search">
      <label>搜索题目 <input id="problem-search" type="search" placeholder="输入题号或标题"></label>
      <label>难度 <select id="difficulty-filter"><option value="">全部难度</option></select></label>
      <label>章节 <select id="chapter-filter"><option value="">全部章节</option></select></label>
    </form>
    <p id="practice-status" role="status">正在加载题库…</p>
    <div id="problem-list" class="resource-list"></div>
    <noscript>请启用 JavaScript 查看题库。</noscript>
  </main>
</body>
</html>
