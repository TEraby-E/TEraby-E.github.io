  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;bfs-train-simulator&quot; class=&quot;bfs-vis&quot;&gt;
  &lt;style&gt;
    #bfs-train-simulator {
      color: var(--foreground);
      width: 100%;
      background-image: url(&quot;data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27210%27%20height%3D%2796%27%20viewBox%3D%270%200%20210%2096%27%3E%3Ctext%20x%3D%2718%27%20y%3D%2758%27%20transform%3D%27rotate(-24%20105%2048)%27%20fill%3D%27%2357a9db%27%20fill-opacity%3D%27.085%27%20font-family%3D%27-apple-system%2CBlinkMacSystemFont%2CSegoe%20UI%2CPingFang%20SC%2CMicrosoft%20YaHei%2Csans-serif%27%20font-size%3D%2714%27%20font-weight%3D%27500%27%20letter-spacing%3D%271%27%3E王道计算机考研%3C%2Ftext%3E%3C%2Fsvg%3E&quot;);
      background-position: 8px 4px;
      background-repeat: repeat;
      background-size: 210px 96px;
    }
    #bfs-train-simulator .controls-row {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 0.65rem;
      margin-bottom: 0.75rem;
    }
    #bfs-train-simulator .controls-row .field {
      min-width: 7rem;
    }
    #bfs-train-simulator .state-card {
      margin-bottom: 0.8rem;
      padding: 0.75rem;
    }
    #bfs-train-simulator .state-top {
      display: flex;
      flex-wrap: wrap;

      align-items: baseline;
      margin-bottom: 0.55rem;
    }
    #bfs-train-simulator .state-top strong {
      font-weight: 500;
    }
    #bfs-train-simulator .queue-line {
      color: var(--muted-foreground);
    }
    #bfs-train-simulator .dist-table,
    #bfs-train-simulator .matrix-table {
      border-collapse: collapse;
      width: auto;
      max-width: 100%;
      font-size: calc(var(--font-size-base) * 0.84);
    }
    #bfs-train-simulator .dist-table th,
    #bfs-train-simulator .dist-table td,
    #bfs-train-simulator .matrix-table th,
    #bfs-train-simulator .matrix-table td {
      border: 1px solid var(--border);

      padding: 0.27rem 0.42rem;
      min-width: 1.8rem;
    }
    #bfs-train-simulator .dist-table th,
    #bfs-train-simulator .matrix-table th {
      color: var(--muted-foreground);
      font-weight: 500;
      background: var(--muted);
    }
    #bfs-train-simulator .dist-table td.is-current,
    #bfs-train-simulator .matrix-table td.is-scanning {
      background: var(--primary);
      color: var(--primary-foreground);
    }
    #bfs-train-simulator .dist-table td.is-queued {
      background: color-mix(in srgb, var(--viz-series-2) 22%, transparent);
    }
    #bfs-train-simulator .main-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr);
      gap: 1rem;
      align-items: start;
    }
    #bfs-train-simulator .left-stack {
      display: grid;
      gap: 0.75rem;
    }
    #bfs-train-simulator .section-label {
      color: var(--muted-foreground);
      font-weight: 500;
      margin-bottom: 0.35rem;
    }
    #bfs-train-simulator svg {
      display: block;
      width: 100%;
      height: auto;
      min-height: 18rem;
    }
    #bfs-train-simulator .edge {
      stroke: var(--border);
      stroke-width: 2;
    }
    #bfs-train-simulator .edge.is-path {
      stroke: var(--viz-series-3);
      stroke-width: 5;
    }
    #bfs-train-simulator .node circle {
      fill: var(--background);
      stroke: var(--border);
      stroke-width: 2;
      transition: fill 180ms ease, stroke 180ms ease;
    }
    #bfs-train-simulator .node text {
      fill: var(--foreground);
      text-anchor: middle;
      dominant-baseline: middle;
      font-weight: 500;
      pointer-events: none;
    }
    #bfs-train-simulator .node .role {
      fill: var(--muted-foreground);
      font-weight: 400;
      font-size: calc(var(--font-size-base) * 0.65);
    }
    #bfs-train-simulator .node.is-queued circle {
      fill: color-mix(in srgb, var(--viz-series-2) 25%, var(--background));
      stroke: var(--viz-series-2);
    }
    #bfs-train-simulator .node.is-done circle {
      fill: var(--muted);
      stroke: var(--muted-foreground);
    }
    #bfs-train-simulator .node.is-current circle {
      fill: var(--primary);
      stroke: var(--primary);
    }
    #bfs-train-simulator .node.is-current .number {
      fill: var(--primary-foreground);
    }
    #bfs-train-simulator .node.is-path circle {
      stroke: var(--viz-series-3);
      stroke-width: 4;
    }
    #bfs-train-simulator .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 0.8rem;
      color: var(--muted-foreground);
      font-size: calc(var(--font-size-base) * 0.82);
    }
    #bfs-train-simulator .legend span {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    #bfs-train-simulator .swatch {
      width: 0.72rem;
      height: 0.72rem;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--background);
    }
    #bfs-train-simulator .swatch.current {
      background: var(--primary);
      border-color: var(--primary);
    }
    #bfs-train-simulator .swatch.queued {
      background: color-mix(in srgb, var(--viz-series-2) 25%, var(--background));
      border-color: var(--viz-series-2);
    }
    #bfs-train-simulator .swatch.done {
      background: var(--muted);
      border-color: var(--muted-foreground);
    }
    #bfs-train-simulator .swatch.path {
      border-color: var(--viz-series-3);
      border-width: 3px;
    }
    #bfs-train-simulator .code-panel {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: calc(var(--font-size-base) * 0.78);
      line-height: 1.55;
    }
    #bfs-train-simulator .code-line {
      display: grid;
      grid-template-columns: 1.8rem minmax(0, 1fr);
      gap: 0.45rem;
      padding: 0.16rem 0.35rem;
      border-left: 3px solid transparent;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    #bfs-train-simulator .code-line .ln {
      color: var(--muted-foreground);
      text-align: right;
      user-select: none;
    }
    #bfs-train-simulator .code-line.is-active {
      background: var(--accent);
      color: var(--accent-foreground);
      border-left-color: var(--primary);
    }
    #bfs-train-simulator .matrix-wrap {
      max-width: 100%;
    }
    @media (max-width: 680px) {
      #bfs-train-simulator .main-grid {
        grid-template-columns: 1fr;
      }
      #bfs-train-simulator svg {
        min-height: 15rem;
      }
      #bfs-train-simulator .matrix-table {
        font-size: calc(var(--font-size-base) * 0.72);
      }
      #bfs-train-simulator .matrix-table th,
      #bfs-train-simulator .matrix-table td {
        min-width: 1.45rem;
        padding: 0.2rem 0.28rem;
      }
    }
  &lt;/style&gt;

  &lt;div class=&quot;viz-controls controls-row&quot; aria-label=&quot;BFS controls&quot;&gt;
    &lt;label class=&quot;form-label field&quot;&gt;起点
      &lt;select class=&quot;form-select&quot; id=&quot;bfs-start&quot;&gt;&lt;/select&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label field&quot;&gt;终点
      &lt;select class=&quot;form-select&quot; id=&quot;bfs-end&quot;&gt;&lt;/select&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label field&quot;&gt;速度
      &lt;select class=&quot;form-select&quot; id=&quot;bfs-speed&quot;&gt;
        &lt;option value=&quot;1100&quot;&gt;慢速&lt;/option&gt;
        &lt;option value=&quot;650&quot; selected&gt;正常&lt;/option&gt;
        &lt;option value=&quot;320&quot;&gt;快速&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;bfs-reset&quot;&gt;重置&lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;bfs-step&quot;&gt;单步&lt;/button&gt;

  &lt;/div&gt;

  &lt;div class=&quot;card state-card&quot; aria-live=&quot;polite&quot;&gt;
    &lt;div class=&quot;state-top&quot;&gt;
      &lt;strong id=&quot;bfs-status&quot;&gt;等待开始&lt;/strong&gt;
      &lt;span&gt;当前顶点：&lt;span id=&quot;bfs-current&quot;&gt;—&lt;/span&gt;&lt;/span&gt;
      &lt;span class=&quot;queue-line&quot;&gt;队列：&lt;span id=&quot;bfs-queue&quot;&gt;[]&lt;/span&gt;&lt;/span&gt;
      &lt;span&gt;结果：&lt;span id=&quot;bfs-result&quot;&gt;—&lt;/span&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;table class=&quot;dist-table&quot; aria-label=&quot;Distance array&quot;&gt;
      &lt;thead&gt;&lt;tr id=&quot;bfs-dist-head&quot;&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;&lt;tr id=&quot;bfs-dist-row&quot;&gt;&lt;/tr&gt;&lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/div&gt;

  &lt;div class=&quot;main-grid&quot;&gt;
    &lt;div class=&quot;left-stack&quot;&gt;
      &lt;section aria-label=&quot;Undirected city graph&quot;&gt;
        &lt;div class=&quot;section-label&quot;&gt;无向图&lt;/div&gt;
        &lt;svg viewBox=&quot;0 0 430 330&quot; role=&quot;img&quot; aria-label=&quot;六个城市及直达列车线路&quot;&gt;
          &lt;g id=&quot;bfs-edges&quot;&gt;&lt;/g&gt;
          &lt;g id=&quot;bfs-nodes&quot;&gt;&lt;/g&gt;
        &lt;/svg&gt;
        &lt;div class=&quot;legend&quot; aria-label=&quot;Graph state legend&quot;&gt;
          &lt;span&gt;&lt;i class=&quot;swatch current&quot;&gt;&lt;/i&gt;当前&lt;/span&gt;
          &lt;span&gt;&lt;i class=&quot;swatch queued&quot;&gt;&lt;/i&gt;队列中&lt;/span&gt;
          &lt;span&gt;&lt;i class=&quot;swatch done&quot;&gt;&lt;/i&gt;已扩展&lt;/span&gt;
          &lt;span&gt;&lt;i class=&quot;swatch path&quot;&gt;&lt;/i&gt;最短路径&lt;/span&gt;
        &lt;/div&gt;
      &lt;/section&gt;
      &lt;section class=&quot;matrix-wrap&quot; aria-label=&quot;Adjacency matrix&quot;&gt;
        &lt;div class=&quot;section-label&quot;&gt;邻接矩阵&lt;/div&gt;
        &lt;table class=&quot;matrix-table&quot; id=&quot;bfs-matrix&quot;&gt;&lt;/table&gt;
      &lt;/section&gt;
    &lt;/div&gt;

    &lt;section aria-label=&quot;BFS source code&quot;&gt;
      &lt;div class=&quot;section-label&quot;&gt;BFS 代码执行位置&lt;/div&gt;
      &lt;div class=&quot;code-panel&quot; id=&quot;bfs-code&quot;&gt;&lt;/div&gt;
    &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;bfs-train-simulator&#x27;);
      if (!root) return;

      const n = 6;
      const edges = [[0,1],[0,2],[1,3],[1,4],[2,4],[2,5],[3,5],[4,5]];
      const matrix = Array.from({length:n}, () =&gt; Array(n).fill(0));
      edges.forEach(([a,b]) =&gt; { matrix[a][b] = 1; matrix[b][a] = 1; });
      const positions = [
        [70,70], [210,45], [70,210], [355,70], [220,185], [350,250]
      ];
      const codeLines = [
        &#x27;for (i = 0; i &lt; n; i++) dist[i] = -1;&#x27;,
        &#x27;dist[start] = 0;&#x27;,
        &#x27;queue[rear++] = start;&#x27;,
        &#x27;while (front &lt; rear) {&#x27;,
        &#x27;    v = queue[front++];&#x27;,
        &#x27;    if (v == end) return dist[v];&#x27;,
        &#x27;    for (w = 0; w &lt; n; w++)&#x27;,
        &#x27;        if (Edge[v][w] &amp;&amp; dist[w] == -1) {&#x27;,
        &#x27;            dist[w] = dist[v] + 1;&#x27;,
        &#x27;            queue[rear++] = w;&#x27;,
        &#x27;        }&#x27;,
        &#x27;}&#x27;,
        &#x27;return -1;&#x27;
      ];

      const els = {
        start: root.querySelector(&#x27;#bfs-start&#x27;),
        end: root.querySelector(&#x27;#bfs-end&#x27;),
        speed: root.querySelector(&#x27;#bfs-speed&#x27;),
        reset: root.querySelector(&#x27;#bfs-reset&#x27;),
        step: root.querySelector(&#x27;#bfs-step&#x27;),
        play: root.querySelector(&#x27;#bfs-play&#x27;),
        status: root.querySelector(&#x27;#bfs-status&#x27;),
        current: root.querySelector(&#x27;#bfs-current&#x27;),
        queue: root.querySelector(&#x27;#bfs-queue&#x27;),
        result: root.querySelector(&#x27;#bfs-result&#x27;),
        distHead: root.querySelector(&#x27;#bfs-dist-head&#x27;),
        distRow: root.querySelector(&#x27;#bfs-dist-row&#x27;),
        edgeGroup: root.querySelector(&#x27;#bfs-edges&#x27;),
        nodeGroup: root.querySelector(&#x27;#bfs-nodes&#x27;),
        matrix: root.querySelector(&#x27;#bfs-matrix&#x27;),
        code: root.querySelector(&#x27;#bfs-code&#x27;)
      };

      let state;
      let timer = null;
      let playing = false;

      function makeOptions(select, selected) {
        select.innerHTML = &#x27;&#x27;;
        for (let i = 0; i &lt; n; i++) {
          const option = document.createElement(&#x27;option&#x27;);
          option.value = String(i);
          option.textContent = `城市 ${i}`;
          option.selected = i === selected;
          select.appendChild(option);
        }
      }

      function buildStatic() {
        makeOptions(els.start, 0);
        makeOptions(els.end, 5);

        edges.forEach(([a,b]) =&gt; {
          const line = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;line&#x27;);
          line.setAttribute(&#x27;x1&#x27;, positions[a][0]);
          line.setAttribute(&#x27;y1&#x27;, positions[a][1]);
          line.setAttribute(&#x27;x2&#x27;, positions[b][0]);
          line.setAttribute(&#x27;y2&#x27;, positions[b][1]);
          line.setAttribute(&#x27;class&#x27;, &#x27;edge&#x27;);
          line.dataset.a = a;
          line.dataset.b = b;
          els.edgeGroup.appendChild(line);
        });

        positions.forEach(([x,y], i) =&gt; {
          const g = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;g&#x27;);
          g.setAttribute(&#x27;class&#x27;, &#x27;node&#x27;);
          g.dataset.node = i;
          const circle = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;circle&#x27;);
          circle.setAttribute(&#x27;cx&#x27;, x);
          circle.setAttribute(&#x27;cy&#x27;, y);
          circle.setAttribute(&#x27;r&#x27;, 28);
          const number = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;text&#x27;);
          number.setAttribute(&#x27;x&#x27;, x);
          number.setAttribute(&#x27;y&#x27;, y - 3);
          number.setAttribute(&#x27;class&#x27;, &#x27;number&#x27;);
          number.textContent = i;
          const role = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;text&#x27;);
          role.setAttribute(&#x27;x&#x27;, x);
          role.setAttribute(&#x27;y&#x27;, y + 15);
          role.setAttribute(&#x27;class&#x27;, &#x27;role&#x27;);
          role.dataset.role = i;
          g.append(circle, number, role);
          els.nodeGroup.appendChild(g);
        });

        const headRow = document.createElement(&#x27;tr&#x27;);
        const corner = document.createElement(&#x27;th&#x27;);
        corner.textContent = &#x27;城市&#x27;;
        headRow.appendChild(corner);
        for (let i = 0; i &lt; n; i++) {
          const th = document.createElement(&#x27;th&#x27;);
          th.textContent = i;
          headRow.appendChild(th);
        }
        els.matrix.appendChild(headRow);
        for (let r = 0; r &lt; n; r++) {
          const tr = document.createElement(&#x27;tr&#x27;);
          const th = document.createElement(&#x27;th&#x27;);
          th.textContent = r;
          tr.appendChild(th);
          for (let c = 0; c &lt; n; c++) {
            const td = document.createElement(&#x27;td&#x27;);
            td.textContent = matrix[r][c];
            td.dataset.r = r;
            td.dataset.c = c;
            tr.appendChild(td);
          }
          els.matrix.appendChild(tr);
        }

        const h0 = document.createElement(&#x27;th&#x27;);
        h0.textContent = &#x27;城市&#x27;;
        els.distHead.appendChild(h0);
        const d0 = document.createElement(&#x27;th&#x27;);
        d0.textContent = &#x27;dist&#x27;;
        els.distRow.appendChild(d0);
        for (let i = 0; i &lt; n; i++) {
          const th = document.createElement(&#x27;th&#x27;);
          th.textContent = i;
          els.distHead.appendChild(th);
          const td = document.createElement(&#x27;td&#x27;);
          td.dataset.dist = i;
          td.textContent = &#x27;-1&#x27;;
          els.distRow.appendChild(td);
        }

        codeLines.forEach((line, i) =&gt; {
          const row = document.createElement(&#x27;div&#x27;);
          row.className = &#x27;code-line&#x27;;
          row.dataset.line = i + 1;
          const ln = document.createElement(&#x27;span&#x27;);
          ln.className = &#x27;ln&#x27;;
          ln.textContent = i + 1;
          const code = document.createElement(&#x27;span&#x27;);
          code.textContent = line;
          row.append(ln, code);
          els.code.appendChild(row);
        });
      }

      function resetState() {
        stopPlaying();
        const start = Number(els.start.value);
        const end = Number(els.end.value);
        state = {
          start, end,
          dist: Array(n).fill(-1),
          parent: Array(n).fill(-1),
          queue: [],
          done: new Set(),
          current: null,
          scan: null,
          pending: null,
          phase: &#x27;init&#x27;,
          activeLine: 1,
          finished: false,
          found: false,
          pathNodes: new Set(),
          pathEdges: new Set(),
          message: &#x27;等待开始&#x27;
        };
        render();
      }

      function edgeKey(a,b) {
        return a &lt; b ? `${a}-${b}` : `${b}-${a}`;
      }

      function finish(found) {
        state.finished = true;
        state.found = found;
        state.scan = null;
        state.pending = null;
        if (found) {
          let x = state.end;
          while (x !== -1) {
            state.pathNodes.add(x);
            const p = state.parent[x];
            if (p !== -1) state.pathEdges.add(edgeKey(x,p));
            x = p;
          }
          state.message = `完成：最少乘坐 ${state.dist[state.end]} 趟列车`;
          state.activeLine = 6;
        } else {
          state.message = &#x27;完成：终点不可达，返回 -1&#x27;;
          state.activeLine = 13;
        }
        stopPlaying();
      }

      function advance() {
        if (state.finished) return;
        if (state.phase === &#x27;init&#x27;) {
          state.dist.fill(-1);
          state.message = &#x27;初始化 dist：-1 表示未访问&#x27;;
          state.activeLine = 1;
          state.phase = &#x27;start-distance&#x27;;
        } else if (state.phase === &#x27;start-distance&#x27;) {
          state.dist[state.start] = 0;
          state.message = `dist[${state.start}] = 0`;
          state.activeLine = 2;
          state.phase = &#x27;enqueue-start&#x27;;
        } else if (state.phase === &#x27;enqueue-start&#x27;) {
          state.queue.push(state.start);
          state.message = `起点 ${state.start} 入队`;
          state.activeLine = 3;
          state.phase = &#x27;dequeue&#x27;;
        } else if (state.phase === &#x27;dequeue&#x27;) {
          if (state.queue.length === 0) {
            finish(false);
          } else {
            state.current = state.queue.shift();
            state.message = `城市 ${state.current} 出队`;
            state.activeLine = 5;
            state.phase = &#x27;check-end&#x27;;
          }
        } else if (state.phase === &#x27;check-end&#x27;) {
          state.activeLine = 6;
          if (state.current === state.end) {
            finish(true);
          } else {
            state.scan = 0;
            state.message = `扫描邻接矩阵第 ${state.current} 行`;
            state.phase = &#x27;scan&#x27;;
          }
        } else if (state.phase === &#x27;scan&#x27;) {
          if (state.scan &gt;= n) {
            state.done.add(state.current);
            state.message = `城市 ${state.current} 的邻接点扫描完毕`;
            state.current = null;
            state.scan = null;
            state.activeLine = 4;
            state.phase = &#x27;dequeue&#x27;;
          } else {
            const w = state.scan;
            state.activeLine = 8;
            state.message = `检查 Edge[${state.current}][${w}] = ${matrix[state.current][w]}`;
            state.scan += 1;
            if (matrix[state.current][w] !== 0 &amp;&amp; state.dist[w] === -1) {
              state.pending = w;
              state.phase = &#x27;discover-distance&#x27;;
            }
          }
        } else if (state.phase === &#x27;discover-distance&#x27;) {
          const w = state.pending;
          state.dist[w] = state.dist[state.current] + 1;
          state.parent[w] = state.current;
          state.message = `发现城市 ${w}：dist[${w}] = ${state.dist[w]}`;
          state.activeLine = 9;
          state.phase = &#x27;discover-enqueue&#x27;;
        } else if (state.phase === &#x27;discover-enqueue&#x27;) {
          const w = state.pending;
          state.queue.push(w);
          state.message = `城市 ${w} 首次入队`;
          state.activeLine = 10;
          state.pending = null;
          state.phase = &#x27;scan&#x27;;
        }
        render();
      }

      function render() {
        els.status.textContent = state.message;
        els.current.textContent = state.current === null ? &#x27;—&#x27; : state.current;
        els.queue.textContent = `[${state.queue.join(&#x27;, &#x27;)}]`;
        els.result.textContent = state.finished
          ? (state.found ? `${state.dist[state.end]} 趟` : &#x27;-1&#x27;)
          : &#x27;—&#x27;;

        root.querySelectorAll(&#x27;[data-dist]&#x27;).forEach(td =&gt; {
          const i = Number(td.dataset.dist);
          td.textContent = state.dist[i];
          td.classList.toggle(&#x27;is-current&#x27;, i === state.current);
          td.classList.toggle(&#x27;is-queued&#x27;, state.queue.includes(i));
        });

        root.querySelectorAll(&#x27;.node&#x27;).forEach(g =&gt; {
          const i = Number(g.dataset.node);
          g.classList.toggle(&#x27;is-current&#x27;, i === state.current);
          g.classList.toggle(&#x27;is-queued&#x27;, state.queue.includes(i));
          g.classList.toggle(&#x27;is-done&#x27;, state.done.has(i));
          g.classList.toggle(&#x27;is-path&#x27;, state.pathNodes.has(i));
          const role = g.querySelector(&#x27;.role&#x27;);
          role.textContent = i === state.start &amp;&amp; i === state.end ? &#x27;S/T&#x27; : i === state.start ? &#x27;S&#x27; : i === state.end ? &#x27;T&#x27; : &#x27;&#x27;;
        });

        root.querySelectorAll(&#x27;.edge&#x27;).forEach(line =&gt; {
          line.classList.toggle(&#x27;is-path&#x27;, state.pathEdges.has(edgeKey(Number(line.dataset.a), Number(line.dataset.b))));
        });

        root.querySelectorAll(&#x27;.matrix-table td&#x27;).forEach(td =&gt; {
          const r = Number(td.dataset.r);
          const c = Number(td.dataset.c);
          const scanningCol = state.phase === &#x27;scan&#x27; ? state.scan - 1 : state.pending;
          td.classList.toggle(&#x27;is-scanning&#x27;, r === state.current &amp;&amp; c === scanningCol);
        });

        root.querySelectorAll(&#x27;.code-line&#x27;).forEach(row =&gt; {
          row.classList.toggle(&#x27;is-active&#x27;, Number(row.dataset.line) === state.activeLine);
        });

        els.step.disabled = state.finished;
        els.start.disabled = state.phase !== &#x27;init&#x27;;
        els.end.disabled = state.phase !== &#x27;init&#x27;;
      }

      function stopPlaying() {
        playing = false;
        if (timer !== null) {
          clearTimeout(timer);
          timer = null;
        }
        els.play.textContent = &#x27;自动播放&#x27;;
        els.play.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;);
      }

      function schedule() {
        if (!playing || state.finished) return;
        timer = setTimeout(() =&gt; {
          advance();
          schedule();
        }, Number(els.speed.value));
      }

      function togglePlay() {
        if (playing) {
          stopPlaying();
        } else if (!state.finished) {
          playing = true;
          els.play.textContent = &#x27;暂停&#x27;;
          els.play.setAttribute(&#x27;aria-pressed&#x27;, &#x27;true&#x27;);
          advance();
          schedule();
        }
      }

      buildStatic();
      resetState();
      els.reset.addEventListener(&#x27;click&#x27;, resetState);
      els.step.addEventListener(&#x27;click&#x27;, advance);
      els.play.addEventListener(&#x27;click&#x27;, togglePlay);
      els.start.addEventListener(&#x27;change&#x27;, resetState);
      els.end.addEventListener(&#x27;change&#x27;, resetState);
      els.speed.addEventListener(&#x27;change&#x27;, () =&gt; {
        if (playing) {
          clearTimeout(timer);
          timer = null;
          schedule();
        }
      });
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();

    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
