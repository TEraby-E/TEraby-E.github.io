  &lt;/style&gt;

  &lt;div class=&quot;controls-wrap&quot;&gt;
    &lt;div class=&quot;viz-controls&quot; aria-label=&quot;动画控制&quot;&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; id=&quot;heap-play&quot;&gt;自动播放&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;heap-next&quot;&gt;下一步&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; id=&quot;heap-reset&quot;&gt;重置&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;text-small text-muted&quot; id=&quot;heap-progress&quot;&gt;步骤 1 / 1&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;stream&quot; id=&quot;heap-stream&quot; aria-label=&quot;待扫描的数组元素&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;status-line&quot; id=&quot;heap-status&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;

  &lt;div class=&quot;tree-wrap&quot;&gt;
    &lt;svg class=&quot;heap-svg&quot; id=&quot;heap-svg&quot; viewBox=&quot;0 0 720 320&quot; role=&quot;img&quot; aria-labelledby=&quot;heap-svg-title heap-svg-desc&quot;&gt;
      &lt;title id=&quot;heap-svg-title&quot;&gt;容量为 10 的大根堆&lt;/title&gt;
      &lt;desc id=&quot;heap-svg-desc&quot;&gt;每个圆圈是堆中的一个元素，堆顶是当前十个候选数中最大的数。&lt;/desc&gt;
      &lt;g id=&quot;heap-edges&quot;&gt;&lt;/g&gt;
      &lt;g id=&quot;heap-nodes&quot;&gt;&lt;/g&gt;
    &lt;/svg&gt;
  &lt;/div&gt;

  &lt;div class=&quot;array-row&quot; id=&quot;heap-array&quot; aria-label=&quot;堆的顺序存储数组&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;legend text-small&quot;&gt;
    &lt;span&gt;&lt;i class=&quot;dot top&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;堆顶：10 个候选数中最大的数&lt;/span&gt;
    &lt;span&gt;&lt;i class=&quot;dot&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;其余 9 个堆元素&lt;/span&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;heap-top-ten-demo&#x27;);
      const values = [23, 5, 81, 14, 9, 42, 3, 60, 18, 7, 11, 2, 90, 6, 1];
      const positions = [
        [360, 38],
        [205, 112], [515, 112],
        [120, 196], [285, 196], [435, 196], [600, 196],
        [70, 280], [165, 280], [250, 280]
      ];
      const display = value =&gt; value === Infinity ? &#x27;∞&#x27; : String(value);
      const clone = heap =&gt; heap.slice();
      const actions = [];
      let heap = Array(10).fill(Infinity);

      actions.push({ heap: clone(heap), inputIndex: -1, kind: &#x27;start&#x27;, active: [], message: &#x27;先准备 10 个位置；∞ 表示“目前还没有候选数”。&#x27; });

      values.forEach((value, inputIndex) =&gt; {
        actions.push({ heap: clone(heap), inputIndex, kind: &#x27;compare&#x27;, active: [0], message: `读入 ${value}，只和堆顶 ${display(heap[0])} 比较。` });
        if (value &lt; heap[0]) {
          const old = heap[0];
          heap[0] = value;
          actions.push({ heap: clone(heap), inputIndex, kind: &#x27;replace&#x27;, active: [0], message: `${value} 更小：淘汰堆顶 ${display(old)}，把 ${value} 放到堆顶。` });
          let i = 0;
          while (true) {
            const left = i * 2 + 1;
            const right = i * 2 + 2;
            if (left &gt;= heap.length) break;
            let larger = left;
            if (right &lt; heap.length &amp;&amp; heap[right] &gt; heap[left]) larger = right;
            if (heap[i] &gt;= heap[larger]) break;
            [heap[i], heap[larger]] = [heap[larger], heap[i]];
            actions.push({ heap: clone(heap), inputIndex, kind: &#x27;swap&#x27;, active: [i, larger], message: `向下调整：较大的子结点上移，恢复“大根堆”。` });
            i = larger;
          }
          actions.push({ heap: clone(heap), inputIndex, kind: &#x27;settled&#x27;, active: [0], message: `调整完成。现在堆顶 ${display(heap[0])} 是 10 个候选数中最大的。` });
        } else {
          actions.push({ heap: clone(heap), inputIndex, kind: &#x27;discard&#x27;, active: [0], message: `${value} ≥ 堆顶 ${display(heap[0])}，它不可能进入最小的 10 个数，直接丢弃。` });
        }
      });
      actions.push({ heap: clone(heap), inputIndex: values.length, kind: &#x27;finish&#x27;, active: [], message: `扫描结束：堆里的 10 个元素就是最小的 10 个数；它们不保证有序。` });

      const edges = root.querySelector(&#x27;#heap-edges&#x27;);
      const nodes = root.querySelector(&#x27;#heap-nodes&#x27;);
      const stream = root.querySelector(&#x27;#heap-stream&#x27;);
      const array = root.querySelector(&#x27;#heap-array&#x27;);
      const status = root.querySelector(&#x27;#heap-status&#x27;);
      const progress = root.querySelector(&#x27;#heap-progress&#x27;);
      const play = root.querySelector(&#x27;#heap-play&#x27;);
      const next = root.querySelector(&#x27;#heap-next&#x27;);
      const reset = root.querySelector(&#x27;#heap-reset&#x27;);
      let step = 0;
      let timer = null;

      positions.forEach((pos, i) =&gt; {
        if (i === 0) return;
        const parent = Math.floor((i - 1) / 2);
        const line = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;line&#x27;);
        line.setAttribute(&#x27;class&#x27;, &#x27;edge&#x27;);
        line.setAttribute(&#x27;x1&#x27;, positions[parent][0]);
        line.setAttribute(&#x27;y1&#x27;, positions[parent][1]);
        line.setAttribute(&#x27;x2&#x27;, pos[0]);
        line.setAttribute(&#x27;y2&#x27;, pos[1]);
        edges.appendChild(line);
      });

      positions.forEach((pos, i) =&gt; {
        const g = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;g&#x27;);
        g.setAttribute(&#x27;class&#x27;, `node${i === 0 ? &#x27; root&#x27; : &#x27;&#x27;}`);
        g.setAttribute(&#x27;transform&#x27;, `translate(${pos[0]} ${pos[1]})`);
        g.innerHTML = `&lt;circle r=&quot;28&quot;&gt;&lt;/circle&gt;&lt;text class=&quot;value&quot; y=&quot;-3&quot;&gt;&lt;/text&gt;&lt;text class=&quot;slot&quot; y=&quot;18&quot;&gt;H[${i}]&lt;/text&gt;`;
        nodes.appendChild(g);
      });

      values.forEach(value =&gt; {
        const item = document.createElement(&#x27;span&#x27;);
        item.className = &#x27;stream-item&#x27;;
        item.textContent = value;
        stream.appendChild(item);
      });

      Array.from({ length: 10 }, (_, i) =&gt; {
        const cell = document.createElement(&#x27;div&#x27;);
        cell.className = `array-cell${i === 0 ? &#x27; root&#x27; : &#x27;&#x27;}`;
        cell.innerHTML = `&lt;strong class=&quot;cell-value&quot;&gt;&lt;/strong&gt;&lt;span class=&quot;array-index text-small&quot;&gt;H[${i}]&lt;/span&gt;`;
        array.appendChild(cell);
      });

      function render() {
        const action = actions[step];
        root.querySelectorAll(&#x27;.node&#x27;).forEach((node, i) =&gt; {
          node.classList.toggle(&#x27;active&#x27;, action.active.includes(i));
          node.classList.toggle(&#x27;swap&#x27;, action.kind === &#x27;swap&#x27; &amp;&amp; action.active.includes(i));
          node.querySelector(&#x27;.value&#x27;).textContent = display(action.heap[i]);
        });
        root.querySelectorAll(&#x27;.cell-value&#x27;).forEach((cell, i) =&gt; cell.textContent = display(action.heap[i]));
        root.querySelectorAll(&#x27;.stream-item&#x27;).forEach((item, i) =&gt; {
          item.classList.toggle(&#x27;done&#x27;, i &lt; action.inputIndex || action.kind === &#x27;finish&#x27;);
          item.classList.toggle(&#x27;current&#x27;, i === action.inputIndex &amp;&amp; action.kind !== &#x27;finish&#x27;);
        });
        status.textContent = action.message;
        progress.textContent = `步骤 ${step + 1} / ${actions.length}`;
        next.disabled = step &gt;= actions.length - 1;
      }

      function stop() {
        if (timer) clearInterval(timer);
        timer = null;
        play.textContent = &#x27;自动播放&#x27;;
      }

      function advance() {
        if (step &lt; actions.length - 1) {
          step += 1;
          render();
        } else {
          stop();
        }
      }

      play.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (timer) {
          stop();
          return;
        }
        if (step &gt;= actions.length - 1) step = 0;
        play.textContent = &#x27;暂停&#x27;;
        render();
        timer = setInterval(advance, 780);
      });
      next.addEventListener(&#x27;click&#x27;, () =&gt; { stop(); advance(); });
      reset.addEventListener(&#x27;click&#x27;, () =&gt; { stop(); step = 0; render(); });
      render();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;

    window.crypto?.randomUUID?.() ?? Date.now().toString(36)

  const hoverDelay = 700;
  const skipDelay = 300;

  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

    }

  };

    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,

            elements.floating.style.setProperty(

    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;

      updatePosition(trigger, floating);
    });

      getContent(trigger).length === 0 ||

        ? 0

      openTooltip(trigger);
      return;

      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);

    }

    }

    }

    }

    }
