  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  #tree-diameter-demo .td-detail-section {
    display: grid;
    gap: 0.9rem;
  }

  #tree-diameter-demo .td-values {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;

  #tree-diameter-demo .td-stack-wrap {
    display: grid;
    gap: 0.35rem;
  }

  #tree-diameter-demo .td-stack {
    display: flex;

    gap: 0.35rem;
    min-height: 2rem;
  }

  #tree-diameter-demo .td-stack-item {
    display: inline-flex;
    align-items: center;
    padding: 0.25rem 0.55rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--foreground);
  }

  #tree-diameter-demo .td-stack-item:last-child {
    background: var(--primary);
    color: var(--primary-foreground);
    border-color: var(--primary);

  #tree-diameter-demo .td-code {

    border-top: 1px solid var(--border);

  }

  #tree-diameter-demo .td-code-line {

    grid-template-columns: 2.3rem minmax(0, 1fr);
    gap: 0.5rem;
    padding: 0.18rem 0.35rem;
    color: var(--muted-foreground);
    transition: background 160ms ease, color 160ms ease;

  #tree-diameter-demo .td-code-line span {
    text-align: right;
    user-select: none;
  }

  #tree-diameter-demo .td-code-line code {

    overflow-wrap: anywhere;

  #tree-diameter-demo .td-code-line.is-current {

    color: var(--accent-foreground);

  @media (max-width: 760px) {

&lt;/style&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;tree-diameter-demo&#x27;);
  if (!root) return;

  const children = {
    A: [&#x27;B&#x27;, &#x27;C&#x27;, &#x27;D&#x27;],
    B: [&#x27;E&#x27;, &#x27;F&#x27;],
    C: [],
    D: [&#x27;G&#x27;],
    E: [],
    F: [&#x27;H&#x27;],
    G: [&#x27;I&#x27;],
    H: [],
    I: []
  };

  const edgeKey = (a, b) =&gt; `${a}-${b}`;
  const clone = value =&gt; JSON.parse(JSON.stringify(value));

  const state = {
    diameter: 0,
    activeNode: null,
    activeEdge: null,
    candidateEdges: [],
    bestEdges: [],
    stack: [],
    branch: null,
    nodes: Object.fromEntries(Object.keys(children).map(n =&gt; [n, {
      max1: 0,
      max2: 0,
      height: null,
      status: &#x27;idle&#x27;
    }]))
  };

  const events = [];
  const pushEvent = (line, status) =&gt; {
    events.push({ line, status, state: clone(state) });
  };

  const insertBranch = (node, current, branchInfo) =&gt; {
    let { first, second } = current;
    if (branchInfo.length &gt; first.length) {
      second = first;
      first = branchInfo;
      state.nodes[node].max2 = second.length;
      state.nodes[node].max1 = first.length;
      state.candidateEdges = [...first.edges, ...second.edges];
      pushEvent(12, `${node}: branch=${branchInfo.length} 超过 max1，max2←旧 max1，max1←branch。`);
    } else if (branchInfo.length &gt; second.length) {
      second = branchInfo;
      state.nodes[node].max2 = second.length;
      state.candidateEdges = [...first.edges, ...second.edges];
      pushEvent(14, `${node}: branch=${branchInfo.length} 更新为新的 max2。`);
    } else {
      pushEvent(13, `${node}: branch=${branchInfo.length} 未进入最大的两个分支。`);
    }
    return { first, second };
  };

  const getHeight = node =&gt; {
    state.stack.push(node);
    state.activeNode = node;
    state.activeEdge = null;
    state.branch = null;
    state.candidateEdges = [];
    state.nodes[node].status = &#x27;visiting&#x27;;
    state.nodes[node].max1 = 0;
    state.nodes[node].max2 = 0;
    pushEvent(4, `进入 getHeight(${node})，初始化 max1=max2=0。`);

    let top = {
      first: { length: 0, edges: [] },
      second: { length: 0, edges: [] }
    };

    for (const child of children[node]) {
      state.activeNode = node;
      state.activeEdge = edgeKey(node, child);
      state.branch = null;
      pushEvent(9, `${node} 沿孩子链递归处理 ${child}。`);

      const result = getHeight(child);
      const branchInfo = {
        length: result.height + 1,
        edges: [edgeKey(node, child), ...result.deepestEdges]
      };

      state.activeNode = node;
      state.activeEdge = edgeKey(node, child);
      state.branch = branchInfo.length;
      state.candidateEdges = [...top.first.edges, ...top.second.edges];
      pushEvent(9, `${child} 返回高度 ${result.height}，所以 ${node} 的 branch=${branchInfo.length}。`);
      top = insertBranch(node, top, branchInfo);
    }

    state.activeNode = node;
    state.activeEdge = null;
    state.branch = null;
    state.candidateEdges = [...top.first.edges, ...top.second.edges];
    const candidate = top.first.length + top.second.length;
    pushEvent(16, `${node}: max1+max2=${top.first.length}+${top.second.length}=${candidate}。`);

    if (candidate &gt; state.diameter) {
      state.diameter = candidate;
      state.bestEdges = [...state.candidateEdges];
      pushEvent(17, `${node}: ${candidate} 超过当前直径，diameter 更新为 ${candidate}。`);
    } else {
      pushEvent(16, `${node}: ${candidate} 未超过当前直径 ${state.diameter}。`);
    }

    state.nodes[node].height = top.first.length;
    state.nodes[node].status = &#x27;done&#x27;;
    pushEvent(19, `getHeight(${node}) 返回 ${top.first.length}。`);
    state.stack.pop();

    return {
      height: top.first.length,
      deepestEdges: [...top.first.edges]
    };
  };

  pushEvent(23, &#x27;treeDiameter: 将全局变量 diameter 重置为 0。&#x27;);
  pushEvent(24, &#x27;根结点非空，调用 getHeight(A)。&#x27;);
  getHeight(&#x27;A&#x27;);
  state.activeNode = null;
  state.activeEdge = null;
  state.branch = null;
  state.candidateEdges = [];
  state.stack = [];
  pushEvent(25, `遍历结束，treeDiameter 返回 ${state.diameter}。`);

  const els = {
    play: root.querySelector(&#x27;[data-action=&quot;play&quot;]&#x27;),
    prev: root.querySelector(&#x27;[data-action=&quot;prev&quot;]&#x27;),
    next: root.querySelector(&#x27;[data-action=&quot;next&quot;]&#x27;),
    reset: root.querySelector(&#x27;[data-action=&quot;reset&quot;]&#x27;),
    speed: root.querySelector(&#x27;#td-speed&#x27;),
    speedValue: root.querySelector(&#x27;[data-role=&quot;speed-value&quot;]&#x27;),
    progress: root.querySelector(&#x27;[data-role=&quot;progress&quot;]&#x27;),
    currentNode: root.querySelector(&#x27;[data-role=&quot;current-node&quot;]&#x27;),
    diameter: root.querySelector(&#x27;[data-role=&quot;diameter&quot;]&#x27;),
    pValue: root.querySelector(&#x27;[data-role=&quot;p-value&quot;]&#x27;),
    max1: root.querySelector(&#x27;[data-role=&quot;max1&quot;]&#x27;),
    max2: root.querySelector(&#x27;[data-role=&quot;max2&quot;]&#x27;),
    branch: root.querySelector(&#x27;[data-role=&quot;branch&quot;]&#x27;),
    stack: root.querySelector(&#x27;[data-role=&quot;stack&quot;]&#x27;),
    status: root.querySelector(&#x27;[data-role=&quot;status&quot;]&#x27;)
  };

  let index = 0;
  let timer = null;
  const delays = { 1: 1900, 2: 1300, 3: 850, 4: 520, 5: 300 };

  const render = () =&gt; {
    const event = events[index];
    const s = event.state;
    const nodeInfo = s.activeNode ? s.nodes[s.activeNode] : null;

    els.progress.textContent = `${index + 1} / ${events.length}`;
    els.currentNode.textContent = s.activeNode || &#x27;—&#x27;;
    els.diameter.textContent = s.diameter;
    els.pValue.textContent = s.activeNode || &#x27;—&#x27;;
    els.max1.textContent = nodeInfo ? nodeInfo.max1 : 0;
    els.max2.textContent = nodeInfo ? nodeInfo.max2 : 0;
    els.branch.textContent = s.branch == null ? &#x27;—&#x27; : s.branch;
    els.status.textContent = event.status;

    els.stack.replaceChildren(...s.stack.map(name =&gt; {
      const item = document.createElement(&#x27;span&#x27;);
      item.className = &#x27;td-stack-item&#x27;;
      item.textContent = `getHeight(${name})`;
      return item;
    }));

    root.querySelectorAll(&#x27;.td-code-line&#x27;).forEach(line =&gt; {
      line.classList.toggle(&#x27;is-current&#x27;, Number(line.dataset.line) === event.line);
    });

    root.querySelectorAll(&#x27;.td-node&#x27;).forEach(nodeEl =&gt; {
      const name = nodeEl.dataset.node;
      const info = s.nodes[name];
      const onBest = s.bestEdges.some(key =&gt; key.includes(name));
      nodeEl.classList.toggle(&#x27;is-active&#x27;, name === s.activeNode);
      nodeEl.classList.toggle(&#x27;is-done&#x27;, info.status === &#x27;done&#x27;);
      nodeEl.classList.toggle(&#x27;is-best&#x27;, onBest);
      nodeEl.querySelector(&#x27;.td-node-height&#x27;).textContent = info.height == null ? &#x27;h=?&#x27; : `h=${info.height}`;
      nodeEl.querySelector(&#x27;title&#x27;).textContent = `${name}，高度 ${info.height == null ? &#x27;尚未计算&#x27; : info.height}`;
    });

    root.querySelectorAll(&#x27;[data-edge]&#x27;).forEach(edge =&gt; {
      const key = edge.dataset.edge;
      edge.classList.toggle(&#x27;is-active&#x27;, key === s.activeEdge);
      edge.classList.toggle(&#x27;is-candidate&#x27;, s.candidateEdges.includes(key));
      edge.classList.toggle(&#x27;is-best&#x27;, s.bestEdges.includes(key));
    });

    els.prev.disabled = index === 0;
    els.next.disabled = index === events.length - 1;
    if (index === events.length - 1) stop();
  };

  const stop = () =&gt; {
    if (timer !== null) window.clearInterval(timer);
    timer = null;
    els.play.textContent = &#x27;播放&#x27;;
  };

  const play = () =&gt; {
    if (timer !== null) {
      stop();
      return;
    }
    if (index === events.length - 1) index = 0;
    els.play.textContent = &#x27;暂停&#x27;;
    timer = window.setInterval(() =&gt; {
      if (index &lt; events.length - 1) {
        index += 1;
        render();
      } else {
        stop();
      }
    }, delays[els.speed.value]);
    render();
  };

  els.play.addEventListener(&#x27;click&#x27;, play);
  els.prev.addEventListener(&#x27;click&#x27;, () =&gt; {
    stop();
    if (index &gt; 0) index -= 1;
    render();
  });
  els.next.addEventListener(&#x27;click&#x27;, () =&gt; {
    stop();
    if (index &lt; events.length - 1) index += 1;
    render();
  });
  els.reset.addEventListener(&#x27;click&#x27;, () =&gt; {
    stop();
    index = 0;
    render();
  });
  els.speed.addEventListener(&#x27;input&#x27;, () =&gt; {
    els.speedValue.textContent = els.speed.value;
    if (timer !== null) {
      stop();
      play();
    }
  });

  render();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
